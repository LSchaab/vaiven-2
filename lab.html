<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAIVÉN — lab de partículas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden;
      font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; z-index: 0; }
    #panel { position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(255,255,255,0.9); border: 1px solid #000; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; display: grid; gap: 8px; max-width: 240px; }
    #panel button { cursor: pointer; }
    #panel .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    #readout { font-variant-numeric: tabular-nums; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="panel">
    <strong>lab de partículas</strong>
    <div id="controls">
      <div class="row">
        <button data-shape="punto">Punto</button>
        <button data-shape="circulo">Círculo</button>
        <button data-shape="cinco">Cinco</button>
        <button data-shape="cerebro">Cerebro</button>
      </div>
      <label class="row">progreso
        <input id="progress" type="range" min="0" max="1" step="0.01" value="1">
      </label>
      <label class="row">rotación
        <input id="rot" type="checkbox" checked>
      </label>
      <label class="row">paleta impulso→ancla
        <input id="mix" type="range" min="0" max="1" step="0.01" value="0">
      </label>
      <label class="row">par
        <select id="pair">
          <option value="naranja-azul">naranja / azul</option>
          <option value="violeta-amarillo">violeta / amarillo</option>
        </select>
      </label>
      <label class="row">color ancla
        <select id="ancla">
          <option value="lila">lila</option>
          <option value="verde-agua">verde agua</option>
          <option value="verde">verde</option>
          <option value="azul-oscuro">azul oscuro</option>
          <option value="gris-claro">gris claro</option>
        </select>
      </label>
      <label class="row">estelas
        <input id="trails" type="checkbox">
      </label>
      <label class="row">cantidad <span id="countVal">9000</span>
        <input id="count" type="range" min="1000" max="16000" step="500" value="9000">
      </label>
      <label class="row">tamaño punto <span id="psVal">2</span>
        <input id="psize" type="range" min="1" max="5" step="0.5" value="2">
      </label>
      <label class="row">vel. rotación <span id="rsVal">0.3</span>
        <input id="rspeed" type="range" min="0" max="1.5" step="0.1" value="0.3">
      </label>
      <label class="row">duración morph <span id="mdVal">1.2</span>
        <input id="mdur" type="range" min="0.3" max="3" step="0.1" value="1.2">
      </label>
      <label class="row">fondo
        <select id="bg">
          <option value="#ffffff">blanco</option>
          <option value="#111111">negro</option>
        </select>
      </label>
      <label class="row">simular reduced-motion
        <input id="rm" type="checkbox">
      </label>
    </div>
    <div id="readout">—</div>
  </div>
  <script type="module">
    import { ParticleSystem, sampleShape, PALETTE as PAL } from './particles.js';
    const canvas = document.getElementById('stage');
    const system = new ParticleSystem(canvas, { count: 9000 });
    window.__system = system; // handle para debug en consola
    system.start();
    document.getElementById('readout').textContent =
      `N=${system.count} · reduced-motion=${system.reducedMotion}`;
    for (const btn of document.querySelectorAll('[data-shape]')) {
      btn.addEventListener('click', () => system.morphTo(btn.dataset.shape));
    }
    const progress = document.getElementById('progress');
    progress.addEventListener('input', () => system.setProgressManual(parseFloat(progress.value)));
    const rot = document.getElementById('rot');
    rot.addEventListener('change', () => { system.rotationSpeed = rot.checked ? 0.3 : 0; });
    const mix = document.getElementById('mix');
    mix.addEventListener('input', () => { system.paletteMix = parseFloat(mix.value); });
    const pairSel = document.getElementById('pair');
    pairSel.addEventListener('change', () => {
      system.pair = pairSel.value === 'violeta-amarillo'
        ? [PAL.violeta, PAL.amarillo] : [PAL.naranja, PAL.azul];
    });
    const ancla = document.getElementById('ancla');
    ancla.addEventListener('change', () => { system.anclaColor = PAL[ancla.value]; });
    const trails = document.getElementById('trails');
    trails.addEventListener('change', () => system.setTrails(trails.checked));
    const count = document.getElementById('count');
    const countVal = document.getElementById('countVal');
    count.addEventListener('input', () => {
      countVal.textContent = count.value;
      system.setCount(parseInt(count.value, 10));
    });
    const psize = document.getElementById('psize'), psVal = document.getElementById('psVal');
    psize.addEventListener('input', () => { system.pointSize = parseFloat(psize.value); psVal.textContent = psize.value; });
    const rspeed = document.getElementById('rspeed'), rsVal = document.getElementById('rsVal');
    rspeed.addEventListener('input', () => { system.rotationSpeed = parseFloat(rspeed.value); rsVal.textContent = rspeed.value; });
    const mdur = document.getElementById('mdur'), mdVal = document.getElementById('mdVal');
    mdur.addEventListener('input', () => { system.morphDuration = parseFloat(mdur.value); mdVal.textContent = mdur.value; });
    const bg = document.getElementById('bg');
    bg.addEventListener('change', () => {
      system.bgColor = bg.value;
      document.body.style.background = bg.value;
      document.getElementById('stage').style.background = bg.value;
    });
    const rm = document.getElementById('rm');
    rm.addEventListener('change', () => system.setReducedMotion(rm.checked));
    system.onFps = (fps) => {
      document.getElementById('readout').textContent =
        `N=${system.count} · ${fps} fps · reduced-motion=${system.reducedMotion}`;
    };
    // Cerebro real: reemplaza el placeholder cuando carga el PNG.
    sampleShape('resources/cerebro.png', system.count)
      .then((pts) => system.registerShape('cerebro', pts))
      .catch((e) => console.warn('cerebro real no cargó; queda el placeholder', e));
  </script>
</body>
</html>
